name: Link check

# Daily crawl of labscout.io: every sitemap URL plus every internal link on those pages.
# A failed run means broken links; GitHub emails the failure.
on:
  schedule:
    - cron: '0 1 * * *' # 01:00 UTC daily
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check_links.mjs
